name: Release

# Every push to master: run CI, then build a signed APK and publish it as a
# GitHub Release. Each release is a new build number, so it installs as an
# update over the previous one (e.g. via Obtainium).
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias inside the keystore
#   ANDROID_KEY_PASSWORD      key password
# Keep the keystore safe: Android only installs updates signed with the same key.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Build signed APK and publish release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      - name: Install Android SDK packages
        run: .github/scripts/install-android-sdk.sh

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. See the header of .github/workflows/release.yml."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          chmod 600 "${RUNNER_TEMP}/release.jks"
          test -s "${RUNNER_TEMP}/release.jks"

      # app/build.gradle.kts signs the release with KEYSTORE_PATH & co when set,
      # and -PforkBuildNumber gives the fork application id and version.
      - name: Build signed release APK
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_PASSWORD:-}" || -z "${KEY_ALIAS:-}" || -z "${KEY_PASSWORD:-}" ]]; then
            echo "::error::One or more signing secrets are missing. See the header of .github/workflows/release.yml."
            exit 1
          fi
          ./gradlew \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --stacktrace \
            -PforkBuildNumber="${GITHUB_RUN_NUMBER}" \
            :app:assembleRelease

      - name: Verify signature and name the APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          BUILT="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*.apk" ! -name "*-unsigned.apk" -print -quit)"
          if [[ -z "$BUILT" ]]; then
            echo "::error::Signed release APK not found."
            find app/build/outputs/apk -type f -print || true
            exit 1
          fi
          "${ANDROID_SDK_ROOT}/build-tools/36.0.0/apksigner" verify --print-certs "$BUILT"

          APKANALYZER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/apkanalyzer"
          [[ -x "$APKANALYZER" ]] || APKANALYZER="$(command -v apkanalyzer)"
          VERSION="$("$APKANALYZER" manifest version-name "$BUILT" | tr -d '\r\n')"
          APP_ID="$("$APKANALYZER" manifest application-id "$BUILT" | tr -d '\r\n')"
          echo "Built ${APP_ID} ${VERSION}"

          APK="${RUNNER_TEMP}/MeteoCompare-${VERSION}.apk"
          cp "$BUILT" "$APK"
          sha256sum "$APK"
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: MeteoCompare-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MeteoCompare ${VERSION}" \
            --generate-notes \
            --latest
